<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting VarWISE View</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #0f172a;
        color: #e5e7eb;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: #aab3c5;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.76);
        padding: 18px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 8px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 999px;
        animation: spin 0.85s linear infinite;
        vertical-align: -3px;
      }
      pre {
        height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        margin: 14px 0 0;
        padding: 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.28);
        color: #cbd5e1;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="spinner"></span>Starting VarWISE View</h1>
      <p>First launch may take a while because the catalog and light-curve data are downloaded into a local cache.</p>
      <pre id="log">Waiting for backend output...</pre>
    </div>
    <script>
      const log = document.getElementById('log');
      window.varwiseDesktop.onBackendLog((text) => {
        log.textContent = text || 'Waiting for backend output...';
        log.scrollTop = log.scrollHeight;
      });
    </script>
  </body>
</html>
